<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a081c"/>
      <stop offset="100%" stop-color="#18103d"/>
    </linearGradient>
    <linearGradient id="flowG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#bg_flow)"/>
  <rect x="25" y="20" width="550" height="40" rx="8" fill="#161033" stroke="#2c2060" stroke-width="1"/>
  <circle cx="45" cy="40" r="4" fill="#ef4444"/>
  <circle cx="60" cy="40" r="4" fill="#eab308"/>
  <circle cx="75" cy="40" r="4" fill="#22c55e"/>
  <text x="100" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">FLOW LOGISTICS // FREIGHT CONSOLE</text>
  <text x="490" y="44" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11">Cloud Sync ●</text>

  <!-- Big Shipment Tracking Flow -->
  <rect x="25" y="72" width="550" height="150" rx="10" fill="#161036" stroke="#2d2269" stroke-width="1"/>
  <text x="45" y="100" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">CONSIGNMENT TRACKING #FL-99214</text>
  <text x="45" y="126" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Express Inter-State Cargo In Transit</text>

  <!-- Progress Steps -->
  <g transform="translate(45, 145)">
    <line x1="20" y1="15" x2="480" y2="15" stroke="#2d2269" stroke-width="4"/>
    <line x1="20" y1="15" x2="320" y2="15" stroke="url(#flowG)" stroke-width="4"/>
    
    <circle cx="20" cy="15" r="10" fill="#22c55e"/>
    <text x="20" y="38" fill="#22c55e" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Booked</text>

    <circle cx="170" cy="15" r="10" fill="#22c55e"/>
    <text x="170" y="38" fill="#22c55e" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Dispatched</text>

    <circle cx="320" cy="15" r="12" fill="#8b5cf6" stroke="#ffffff" stroke-width="2"/>
    <text x="320" y="40" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">In Transit</text>

    <circle cx="480" cy="15" r="10" fill="#2d2269"/>
    <text x="480" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Delivered</text>
  </g>

  <!-- Bottom Metric Panels -->
  <rect x="25" y="235" width="170" height="115" rx="8" fill="#140d30" stroke="#271b56" stroke-width="1"/>
  <text x="40" y="262" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">TOTAL WEIGHT</text>
  <text x="40" y="292" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="800">18,500 kg</text>
  <text x="40" y="318" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10">2x High-Cube Container</text>

  <rect x="215" y="235" width="170" height="115" rx="8" fill="#140d30" stroke="#271b56" stroke-width="1"/>
  <text x="230" y="262" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ESTIMATED ARRIVAL</text>
  <text x="230" y="292" fill="#22c55e" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Tomorrow</text>
  <text x="230" y="318" fill="#86efac" font-family="system-ui, sans-serif" font-size="10">09:30 AM PKT Terminal</text>

  <rect x="405" y="235" width="170" height="115" rx="8" fill="#140d30" stroke="#271b56" stroke-width="1"/>
  <text x="420" y="262" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">DISPATCH CARRIER</text>
  <text x="420" y="292" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Volvo FH16</text>
  <text x="420" y="318" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Driver: Rashid Khan</text>
</svg>