<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05030e"/>
      <stop offset="100%" stop-color="#140628"/>
    </linearGradient>
    <linearGradient id="neonG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="synthGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="375" fill="url(#bg_neon)"/>
  <!-- Perspective Grid lines -->
  <line x1="0" y1="375" x2="600" y2="375" stroke="#ec4899" stroke-width="2"/>
  <line x1="0" y1="330" x2="600" y2="330" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <line x1="0" y1="295" x2="600" y2="295" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="220" x2="50" y2="375" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
  <line x1="300" y1="220" x2="180" y2="375" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
  <line x1="300" y1="220" x2="300" y2="375" stroke="#f43f5e" stroke-width="1.5" opacity="0.7"/>
  <line x1="300" y1="220" x2="420" y2="375" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
  <line x1="300" y1="220" x2="550" y2="375" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>

  <!-- Synth Header -->
  <rect x="25" y="20" width="550" height="40" rx="8" fill="#13082a" stroke="#f43f5e" stroke-width="1"/>
  <circle cx="45" cy="40" r="4" fill="#f43f5e"/>
  <circle cx="60" cy="40" r="4" fill="#a855f7"/>
  <circle cx="75" cy="40" r="4" fill="#06b6d4"/>
  <text x="300" y="44" fill="#f43f5e" font-family="'Courier New', monospace" font-size="14" font-weight="900" letter-spacing="3" text-anchor="middle" filter="url(#synthGlow)">NEON INVADERS // SYNTH 84</text>

  <!-- Audio Spectrum Bars -->
  <g transform="translate(100, 80)">
    <rect x="0" y="40" width="12" height="60" fill="#f43f5e" rx="3" filter="url(#synthGlow)"/>
    <rect x="20" y="20" width="12" height="80" fill="#fb7185" rx="3"/>
    <rect x="40" y="5" width="12" height="95" fill="#f43f5e" rx="3" filter="url(#synthGlow)"/>
    <rect x="60" y="30" width="12" height="70" fill="#e879f9" rx="3"/>
    <rect x="80" y="10" width="12" height="90" fill="#c084fc" rx="3"/>
    <rect x="100" y="0" width="12" height="100" fill="#a855f7" rx="3" filter="url(#synthGlow)"/>
    <rect x="120" y="25" width="12" height="75" fill="#818cf8" rx="3"/>
    <rect x="140" y="45" width="12" height="55" fill="#38bdf8" rx="3"/>
    <rect x="160" y="15" width="12" height="85" fill="#06b6d4" rx="3" filter="url(#synthGlow)"/>
    <rect x="180" y="35" width="12" height="65" fill="#22d3ee" rx="3"/>
    <rect x="200" y="10" width="12" height="90" fill="#38bdf8" rx="3"/>
    <rect x="220" y="0" width="12" height="100" fill="#a855f7" rx="3" filter="url(#synthGlow)"/>
    <rect x="240" y="30" width="12" height="70" fill="#f43f5e" rx="3"/>
    <rect x="260" y="15" width="12" height="85" fill="#fb7185" rx="3"/>
    <rect x="280" y="40" width="12" height="60" fill="#c084fc" rx="3"/>
    <rect x="300" y="20" width="12" height="80" fill="#06b6d4" rx="3"/>
    <rect x="320" y="5" width="12" height="95" fill="#f43f5e" rx="3" filter="url(#synthGlow)"/>
    <rect x="340" y="35" width="12" height="65" fill="#a855f7" rx="3"/>
    <rect x="360" y="15" width="12" height="85" fill="#06b6d4" rx="3"/>
    <rect x="380" y="45" width="12" height="55" fill="#f43f5e" rx="3"/>
  </g>

  <!-- Controls Strip -->
  <rect x="60" y="195" width="480" height="42" rx="8" fill="#180b33" stroke="#a855f7" stroke-width="1"/>
  <text x="80" y="221" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="700">BPM: 128</text>
  <text x="180" y="221" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="700">OSC: SAWTOOTH</text>
  <text x="320" y="221" fill="#c084fc" font-family="monospace" font-size="11" font-weight="700">REVERB: 78%</text>
  <text x="440" y="221" fill="#22c55e" font-family="monospace" font-size="11" font-weight="700">MIDI LIVE ●</text>

  <!-- Synth Keyboard -->
  <g transform="translate(60, 250)">
    <!-- White Keys -->
    <rect x="0" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="32" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="64" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="96" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="128" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="160" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="192" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="224" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="256" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="288" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="320" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="352" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="384" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="416" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <rect x="448" y="0" width="30" height="95" rx="3" fill="#ffffff" stroke="#1f1538" stroke-width="1"/>
    <!-- Black Keys -->
    <rect x="20" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
    <rect x="52" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
    <rect x="116" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
    <rect x="148" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
    <rect x="180" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
    <rect x="244" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
    <rect x="276" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
    <rect x="340" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
    <rect x="372" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
    <rect x="404" y="0" width="20" height="60" rx="2" fill="#0f0722" stroke="#a855f7" stroke-width="1"/>
  </g>
</svg>