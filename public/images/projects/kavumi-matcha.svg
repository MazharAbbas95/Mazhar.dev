<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_kav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06120b"/>
      <stop offset="100%" stop-color="#0f2918"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#bg_kav)"/>
  <!-- Ambient organic glow -->
  <circle cx="450" cy="180" r="140" fill="#10b981" opacity="0.16"/>

  <!-- Top Navigation -->
  <rect x="25" y="20" width="550" height="40" rx="8" fill="#091c11" stroke="#163823" stroke-width="1"/>
  <circle cx="45" cy="40" r="4" fill="#ef4444"/>
  <circle cx="60" cy="40" r="4" fill="#eab308"/>
  <circle cx="75" cy="40" r="4" fill="#22c55e"/>
  <text x="110" y="44" fill="#86efac" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2">KAVUMI 香味 MATCHA</text>
  <text x="430" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Shop · Origins · Ceremony</text>

  <!-- Left Product Story -->
  <text x="50" y="115" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">FIRST HARVEST UJI, KYOTO</text>
  <text x="50" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="900">Ceremonial Grade</text>
  <text x="50" y="176" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="26" font-weight="900">Pure Organic Matcha</text>
  <text x="50" y="206" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">Shade-grown stone ground vibrant emerald tea leaves.</text>

  <text x="50" y="255" fill="#34d399" font-family="system-ui, sans-serif" font-size="22" font-weight="800">$42.00</text>
  <text x="135" y="255" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12">30g Luxury Tin</text>

  <rect x="50" y="275" width="160" height="38" rx="8" fill="url(#goldG)"/>
  <text x="130" y="299" fill="#042f1a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Add To Ritual Bag</text>

  <!-- Right Visual Matcha Tin Mockup -->
  <rect x="360" y="85" width="195" height="245" rx="14" fill="#08180e" stroke="#1c472c" stroke-width="1.5"/>
  <!-- Tin Illustration -->
  <rect x="405" y="115" width="105" height="145" rx="12" fill="#041f10" stroke="#34d399" stroke-width="2"/>
  <rect x="415" y="130" width="85" height="60" rx="4" fill="#0a331c"/>
  <text x="457" y="155" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">KAVUMI</text>
  <text x="457" y="172" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">UJI RESERVE</text>
  <!-- Matcha Powder Bowl -->
  <ellipse cx="457" cy="235" rx="36" ry="12" fill="#10b981"/>
  <circle cx="457" cy="233" r="5" fill="#34d399"/>
  <text x="457" y="295" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">100% Ceremonial</text>
</svg>