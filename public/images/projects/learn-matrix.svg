  <text x="45" y="125" fill="#39bae6" font-family="monospace" font-size="11">class</text>
  <text x="85" y="125" fill="#ffb454" font-family="monospace" font-size="11">TreeNode:</text>
  <text x="65" y="145" fill="#39bae6" font-family="monospace" font-size="11">def</text>
  <text x="95" y="145" fill="#59c2ff" font-family="monospace" font-size="11">__init__(self, val=0):</text>
  <text x="85" y="165" fill="#bfbab0" font-family="monospace" font-size="11">self.val = val</text>
  <text x="85" y="185" fill="#bfbab0" font-family="monospace" font-size="11">self.left = None</text>
  <text x="85" y="205" fill="#bfbab0" font-family="monospace" font-size="11">self.right = None</text>

  <text x="45" y="240" fill="#39bae6" font-family="monospace" font-size="11">def</text>
  <text x="75" y="240" fill="#aad94c" font-family="monospace" font-size="11">depth_first_search(root):</text>
  <text x="65" y="260" fill="#ff8f40" font-family="monospace" font-size="11">if not root: return []</text>
  <text x="65" y="280" fill="#ff8f40" font-family="monospace" font-size="11">return dfs(root.left) + [root.val] + dfs(root.right)</text>

